// The watch companion: a Wear OS app that lives on the wrist and talks to
// the phone's shell over the Wearable Data Layer (Bluetooth). The recorder
// itself never runs here - a watch has no room for a Python runtime - so
// this is a remote for the phone: recording state, a Mark button, Start and
// Stop, and the latest value of one signal.
//
// Same applicationId as the phone app on purpose: the Data Layer routes
// messages between the two apps of one package on paired devices, and it
// will not route between two packages. They are two APKs, one for each
// form factor, signed with the same key.
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "com.sarralle.begia.wear"
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.sarralle.begia"
        minSdk 30           // Wear OS 3; a Galaxy Watch 7 runs Wear OS 5 (API 34)
        targetSdk 34
        versionCode 1
        versionName "watch 1"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.wear.compose:compose-material:1.4.1"
    implementation "androidx.wear.compose:compose-foundation:1.4.1"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "com.google.android.gms:play-services-wearable:18.2.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
