// The BEGIA shell: an APK that holds the Python runtime, the binary wheels,
// a WebView and a foreground service - and installs BEGIA itself (app/, ui/,
// the driver) as a payload it can replace without being reinstalled.
//
// Chaquopy 16.1 accepts Android Gradle plugin 8.9 to 8.13; the wrapper pins
// the Gradle that plugin needs, so a checkout builds without anything on the
// PATH but a JDK 17 (build_apk.bat points at the one under %LOCALAPPDATA%).
plugins {
    id "com.android.application" version "8.9.3" apply false
    id "org.jetbrains.kotlin.android" version "2.1.20" apply false
    id "org.jetbrains.kotlin.plugin.compose" version "2.1.20" apply false   // the watch app's UI
    id "com.chaquo.python" version "16.1.0" apply false
}
